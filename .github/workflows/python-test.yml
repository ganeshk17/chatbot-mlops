name: Flask CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run lint checks
      run: |
        # Optional: install lint tool like flake8 and run it
        pip install flake8
        flake8 .

    - name: Run tests
      run: |
        # If you have tests, run them here, e.g.:
        # pytest tests/
        echo "No tests defined yet"