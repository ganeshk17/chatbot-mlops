name: Python CI for Chatbot

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run lint check (optional)
      run: |
        pip install flake8
        flake8 .

    - name: Run tests
      run: |
        # If you have pytest tests, run them here:
        if command -v pytest > /dev/null; then
          pytest || exit 1
        else
          echo "No tests found"
        fi

    - name: Run chatbot script smoke test (optional)
      run: |
        python chatbot.py --test || echo "Skipping chatbot.py test if no CLI test"
